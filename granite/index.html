}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at center, rgba(15,12,10,0.60) 0%, rgba(15,12,10,0.82) 100%);
  pointer-events: none;
  z-index: 0;
}

main {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px 40px;
  text-align: center;
}

.logo {
  width: 130px;
  height: auto;
  margin-bottom: 48px;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.6));
}

h1 {
  font-family: var(--display);
  font-size: clamp(36px, 8vw, 84px);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 14px;
  line-height: 1.05;
  background: linear-gradient(180deg, #FFFFFF 0%, var(--ice-bottom) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  filter:
    drop-shadow(0 2px 4px rgba(0,0,0,0.55))
    drop-shadow(0 -1px 0 rgba(255,255,255,0.10));
}

.subtitle {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(16px, 2.1vw, 20px);
  color: #EDE4CE;
  margin: 0 0 70px;
  letter-spacing: 0.01em;
  text-shadow: 0 2px 4px rgba(0,0,0,0.7);
}

.message {
  font-family: var(--display);
  font-size: clamp(12px, 1.5vw, 15px);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 18px;
  font-weight: 700;
  text-shadow: 0 2px 4px rgba(0,0,0,0.7);
}

.tagline {
  font-family: var(--serif);
  font-size: clamp(20px, 2.5vw, 28px);
  color: #F5EEDA;
  margin: 0 0 90px;
  font-style: italic;
  line-height: 1.4;
  text-shadow: 0 2px 6px rgba(0,0,0,0.75);
}

.capture {
  width: 100%;
  max-width: 480px;
  padding-top: 44px;
  border-top: 1px solid rgba(200, 208, 216, 0.35);
}

.capture-copy {
  font-family: var(--serif);
  font-size: 17px;
  color: #F0E8D2;
  margin: 0 auto 26px;
  font-style: italic;
  line-height: 1.55;
  max-width: 420px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.7);
}

.capture-form {
  display: flex;
  gap: 10px;
  max-width: 420px;
  margin: 0 auto;
}

.capture-form input[type="email"] {
  flex: 1;
  padding: 13px 16px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(200, 208, 216, 0.5);
  border-radius: 3px;
  color: #F0F7FC;
  font-family: var(--serif);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

.capture-form input[type="email"]::placeholder {
  color: rgba(240, 247, 252, 0.4);
  font-style: italic;
}

.capture-form input[type="email"]:focus {
  border-color: var(--ice-bottom);
  background: rgba(0, 0, 0, 0.6);
  box-shadow: 0 0 0 3px rgba(190, 204, 216, 0.12);
}

.capture-form button {
  padding: 13px 24px;
  background: linear-gradient(180deg, var(--ice-top) 0%, var(--ice-bottom) 100%);
  border: none;
  border-radius: 3px;
  color: var(--ink);
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35), inset 0 -1px 0 rgba(0,0,0,0.1);
}

.capture-form button:hover {
  background: linear-gradient(180deg, #FFFFFF 0%, var(--ice-mid) 100%);
  box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 -1px 0 rgba(0,0,0,0.08);
}

.capture-form button:active {
  transform: translateY(1px);
  box-shadow: 0 1px 4px rgba(0,0,0,0.35);
}

.thanks {
  display: none;
  padding: 20px 16px;
  background: rgba(200, 208, 216, 0.1);
  border: 1px solid rgba(200, 208, 216, 0.45);
  border-radius: 3px;
  color: var(--ice-top);
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  text-align: center;
}

footer {
  position: relative;
  z-index: 1;
  padding: 30px 20px 40px;
  text-align: center;
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(240, 232, 210, 0.55);
  text-shadow: 0 2px 4px rgba(0,0,0,0.7);
}

@media (max-width: 600px) {
  main { padding: 40px 20px 30px; }
  .logo { width: 100px; margin-bottom: 38px; }
  h1 { letter-spacing: 0.08em; }
  .subtitle { margin-bottom: 50px; }
  .tagline { margin-bottom: 60px; }
  .capture { padding-top: 34px; }
  .capture-form { flex-direction: column; gap: 12px; }
  .capture-form button { padding: 15px; }
}
</style>
</head>
